{% extends 'core/base_auth.html' %}
{% load pearson_i18n %}
{% block content %}
<h1 class="auth-title">{% t "Forgot your password?" %}</h1>
<p class="auth-sub">{% t "Enter your email and we’ll send you a reset link." %}</p>
<form method="post" novalidate>{% csrf_token %}
  <label class="field"><svg class="ic"><use href="#i-mail"/></svg>
    <input type="email" name="email" placeholder="{% t "Email address" %}" required autofocus></label>
  {% for e in form.email.errors %}<div class="form-error">{{ e }}</div>{% endfor %}
  <button class="btn-primary mt-btn" type="submit">{% t "Send reset link" %}</button>
</form>
<p class="auth-foot"><a class="link strong" href="{% url 'accounts:login' %}">{% t "Back to sign in" %}</a></p>
{% endblock %}
